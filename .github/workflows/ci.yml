name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  macos-build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verify code formatting
        run: cargo fmt --check

      - name: Run clippy linter
        run: cargo clippy -- -D warnings

      - name: Run automated test suite
        run: cargo test

      - name: Verify application bundle build
        run: ./build_app.sh

      - name: Verify bundle integrity and structure
        run: |
          set -euo pipefail
          APP_PATH="Iridecence PDF Reader.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Contents/Info.plist"
          test -x "$APP_PATH/Contents/MacOS/oxireader"
          test -f "$APP_PATH/Contents/Resources/AppIcon.icns"
          plutil -lint "$APP_PATH/Contents/Info.plist"
          codesign --verify --deep --strict "$APP_PATH"
          echo "✓ Application bundle verified successfully."
