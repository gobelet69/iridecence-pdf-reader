name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  macos-build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          fi
          xcodebuild -version

      - name: Build Swift Package
        run: swift build --scratch-path /tmp/swift-build

      - name: Run automated test suite
        run: swift test --scratch-path /tmp/swift-build

      - name: Verify application bundle build
        run: ./build_app.sh

      - name: Verify bundle integrity and structure
        run: |
          set -euo pipefail
          APP_PATH="Iridecence PDF Reader.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Contents/Info.plist"
          test -x "$APP_PATH/Contents/MacOS/Iridescence"
          test -f "$APP_PATH/Contents/Resources/AppIcon.icns"
          plutil -lint "$APP_PATH/Contents/Info.plist"
          codesign --verify --deep --strict "$APP_PATH"
