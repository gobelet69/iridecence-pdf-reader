name: macOS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchains
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy,rustfmt

      - name: Validate release version alignment
        run: |
          set -euo pipefail
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)
          REF_NAME="${{ github.ref_name }}"
          if [[ "$REF_NAME" == v* ]]; then
            TAG_VERSION="${REF_NAME#v}"
            if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
              echo "Error: Cargo.toml version ($CARGO_VERSION) does not match tag ($TAG_VERSION)" >&2
              exit 1
            fi
          fi
          echo "Release version validated: $CARGO_VERSION"

      - name: Run test suite
        run: cargo test

      - name: Configure Apple Developer ID (if configured)
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_ID: ${{ secrets.APPLE_NOTARY_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "${MACOS_CERTIFICATE_P12:-}" ] && [ -n "${MACOS_CERTIFICATE_PASSWORD:-}" ]; then
            echo "Importing Apple Developer ID certificate..."
            KEYCHAIN_PATH="$RUNNER_TEMP/iridescence-signing.keychain-db"
            KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
            CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
            echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE_PATH"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH"
            if [ -n "${APPLE_NOTARY_ID:-}" ]; then
              xcrun notarytool store-credentials iridescence-notary \
                --apple-id "$APPLE_NOTARY_ID" \
                --password "$APPLE_NOTARY_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" \
                --keychain "$KEYCHAIN_PATH"
              echo "NOTARY_PROFILE=iridescence-notary" >> "$GITHUB_ENV"
              echo "NOTARY_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
            fi
            echo "SIGNING_IDENTITY=${{ secrets.MACOS_SIGNING_IDENTITY }}" >> "$GITHUB_ENV"
          else
            echo "No Developer ID certificate configured. Falling back to ad-hoc signing."
            echo "SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      - name: Package Universal 2 DMG and Checksums
        env:
          CODE_SIGN_IDENTITY: ${{ env.SIGNING_IDENTITY }}
          UNIVERSAL: "1"
        run: |
          ./scripts/build_dmg.sh

      - name: Notarize and staple DMG (if credentials available)
        if: env.NOTARY_PROFILE != ''
        run: |
          DMG_FILE=$(find dist -name "*.dmg" | head -n 1)
          echo "Submitting $DMG_FILE for Apple notarization..."
          xcrun notarytool submit "$DMG_FILE" \
            --keychain-profile "$NOTARY_PROFILE" \
            --keychain "$NOTARY_KEYCHAIN" \
            --wait
          xcrun stapler staple "$DMG_FILE"
          (cd dist && shasum -a 256 "$(basename "$DMG_FILE")" > SHA256SUMS.txt)

      - name: Generate Release Notes
        id: notes
        run: |
          cat << 'EOF' > release_notes.md
          ## Iridescence PDF Reader ${{ github.ref_name }}

          Ultra-fast, native macOS PDF reader built in pure Rust with AppKit and PDFKit.

          ### Highlights
          - Native Liquid Glass appearance with dynamic dark/light mode.
          - Multi-document tabs with independent zoom, scroll, and annotation tracking.
          - On-device Apple Vision OCR for scanned document text extraction.
          - Spotlight-style command palette and fuzzy workspace search.
          - Universal 2 binary natively supporting Apple Silicon (arm64) and Intel (x86_64).

          ### Cryptographic Verification
          Verify downloads using the published `SHA256SUMS.txt` manifest.
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Iridescence PDF Reader ${{ github.ref_name }}"
          body_path: release_notes.md
          files: dist/*
          fail_on_unmatched_files: true
