objc2-foundation = "0.3.2"
objc2-pdf-kit = { version = "0.3.2", features = ["PDFThumbnailView", "PDFOutline", "PDFDestination", "PDFAction", "PDFActionGoTo", "PDFAnnotation", "PDFPage", "PDFSelection"] }
once_cell = "1.21.4"
