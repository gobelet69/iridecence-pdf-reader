[package]
name = "oxireader"
version = "0.1.0"
edition = "2024"

[dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSGlassEffectView", "NSGraphics", "NSImage", "NSMenu", "NSMenuItem", "NSSplitView", "NSSplitViewController", "NSToolbar", "NSToolbarItem", "NSStackView", "NSButton", "NSUserInterfaceLayout", "NSOutlineView", "NSTableColumn", "NSTableCellView", "NSTextField", "NSScrollView", "NSControl", "NSTableRowView", "NSUserInterfaceItemIdentification", "NSSegmentedControl"] }
objc2-foundation = "0.3.2"
objc2-pdf-kit = { version = "0.3.2", features = ["PDFThumbnailView"] }
